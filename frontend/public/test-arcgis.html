<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ArcGIS JS API WebScene Test</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/dark/main.css" />
  <script src="https://js.arcgis.com/4.29/"></script>
  <style>
    html, body, #viewDiv {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
      background: #000;
    }
    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 8px 14px;
      font-family: sans-serif;
      font-size: 13px;
      border-radius: 6px;
      z-index: 99;
    }
  </style>
</head>
<body>
  <div id="status">Загрузка 3D сцены...</div>
  <div id="viewDiv"></div>
  <script>
    require([
      "esri/config",
      "esri/WebScene",
      "esri/views/SceneView"
    ], function(esriConfig, WebScene, SceneView) {
      esriConfig.portalUrl = "https://gis.esaulet.kz/portal";
      
      const scene = new WebScene({
        portalItem: {
          id: "b535181687714acb87d95950844aed6a"
        }
      });

      const view = new SceneView({
        container: "viewDiv",
        map: scene,
        camera: {
          position: {
            longitude: 71.428,
            latitude: 51.105,
            z: 2200
          },
          heading: 0,
          tilt: 62
        },
        environment: {
          lighting: {
            date: new Date("2026-06-21T12:00:00Z"),
            directShadowsEnabled: true
          },
          atmosphere: {
            quality: "high"
          }
        }
      });

      scene.load()
        .then(() => {
          document.getElementById('status').innerText = 'Сцена загружена: ' + scene.portalItem.title;
          console.log('Scene successfully loaded!', scene.portalItem.title, 'Slides count:', scene.presentation?.slides?.length);
          
          // Find Baiterek slide or first landmark slide
          const slides = scene.presentation?.slides;
          if (slides && slides.length > 10) {
            const baiterekSlide = slides.getItemAt(10); // Астана-Бәйтерек
            if (baiterekSlide) {
              console.log('Applying slide:', baiterekSlide.title.text);
              baiterekSlide.applyTo(view);
            }
          }
        })
        .catch(err => {
          document.getElementById('status').innerText = 'Ошибка: ' + (err.message || err);
          console.error('Scene load error:', err);
        });
    });
  </script>
</body>
</html>
